<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&family=Luckiest+Guy&family=Nunito:wght@400;600;800&family=Patrick+Hand&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  /* Atelier de BD : encre noire, papier blanc, jaune "pop" pour l'action, cyan pour la sélection */
  --ink:#17171f;
  --paper:#ffffff;
  --desk:#e9ebf2;
  --panel:#f6f7fb;
  --line:#d5d8e3;
  --muted:#6b6f80;
  --pop:#ffd23f;
  --pop-ink:#2a2100;
  --sel:#14a8e6;
  --danger:#e5484d;
  --font-display:"Bangers","Luckiest Guy",Impact,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  /* Layout : barre du haut / rail d'onglets + bibliothèque / plan de travail / propriétés */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

#app{display:grid;grid-template-rows:56px 1fr;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--ink);color:#fff;min-width:0}
.logo{font-family:var(--font-display);font-size:30px;letter-spacing:1px;color:var(--pop);white-space:nowrap;text-shadow:3px 3px 0 #e5484d;transform:rotate(-3deg)}
.logo span{color:#fff}
#projTitle{background:#2a2a36;border:1px solid #3a3a48;border-radius:8px;padding:6px 10px;color:#fff;width:200px;min-width:90px}
.hgroup{display:flex;gap:4px;align-items:center}
.hbtn{display:flex;align-items:center;gap:6px;background:#2a2a36;border:1px solid #3a3a48;color:#fff;border-radius:8px;padding:6px 10px;white-space:nowrap}
.hbtn:hover{background:#383848}
.hbtn.primary{background:var(--pop);color:var(--pop-ink);border-color:var(--pop);font-weight:800}
.hbtn.primary:hover{filter:brightness(1.05)}
.hbtn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
#zoomLbl{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:44px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;min-width:250px;z-index:50;display:none}
.menu-list.open{display:block}
.menu-list button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px}
.menu-list button:hover{background:var(--panel)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu-list small{color:var(--muted)}

main{display:grid;grid-template-columns:78px 290px 1fr 270px;min-height:0}
#rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:4px;overflow-y:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:10px;padding:8px 2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab .ico{font-size:22px;line-height:1}
.tab:hover{background:var(--panel);color:var(--ink)}
.tab.active{background:var(--pop);color:var(--pop-ink);box-shadow:3px 3px 0 var(--ink);border:2px solid var(--ink)}
.tab{border:2px solid transparent}
#library{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px;min-width:0}
#library h2{font-family:var(--font-display);font-weight:400;letter-spacing:1px;font-size:30px;margin:0 0 4px;color:var(--ink);text-shadow:2px 2px 0 var(--pop)}
#library h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
#library p.hint{color:var(--muted);margin:0 0 10px;font-size:13px;line-height:1.4}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center;min-height:56px;position:relative;overflow:hidden;touch-action:pan-y}
.tile{transition:transform .12s,box-shadow .12s,border-color .12s}
.tile:hover{border-color:var(--ink);background:#fff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,20,40,.12)}
.tile.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--pop)}
.tile.layout{flex-direction:column;justify-content:flex-start;padding:5px 5px 18px}
.tile.layout svg{width:100%;height:auto;max-height:none}
.tile.char{min-height:150px;padding:4px 4px 18px;background:linear-gradient(#fff7d6,#ffe9a8)}
.tile.char img{height:128px;max-height:none}
.tile.bub{min-height:116px;flex-direction:column;justify-content:flex-start;padding:10px 4px 20px}
.tile.bub .bthumb{height:86px;display:flex;align-items:flex-start;justify-content:center}
.tile.bub svg{width:auto;height:auto;max-width:none;max-height:none;overflow:visible}
.tile.pst{min-height:64px;padding:4px 2px 16px}
.tile.pst svg{overflow:visible}
.tile.sfx{min-height:58px;background:#fff}
.tile.obj{min-height:96px;padding:6px 4px 18px;background:#fff}
.tile.obj img{max-height:66px;max-width:100%}
.tile.sfx.jp{min-height:76px;padding-bottom:18px}
.tile.char.manga{background:linear-gradient(#fff0f6,#ffd6e7)}
.tab.manga-tab .ico{filter:saturate(1.3)}
.tile.mini-b{min-height:52px;padding:4px 4px 12px}
.tile.mini-b svg{max-width:none;max-height:none;overflow:visible}
.exgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ex{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 2px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.ex span{font-size:22px}
.ex:hover{border-color:var(--ink);background:#fff8d6}
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:-18px;background:#fff;padding:6px 0;z-index:2}
.ctab{border:0;background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:800}
.ctab.on{background:var(--ink);color:#fff}
.ctab.dice{margin-left:auto;background:var(--pop);color:var(--pop-ink)}
.tile img,.tile svg{max-width:100%;max-height:100%;display:block;pointer-events:none}
.tile.emoji{font-size:30px;min-height:48px;padding:2px}
.tile .cap{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.85);text-align:center;padding:1px 0}
.tile.scene{aspect-ratio:4/3;padding:0}
.tile.scene img{width:100%;height:100%;object-fit:cover;max-height:none}
.tile.layout{aspect-ratio:.72;padding:5px}
.tile.layout.land{aspect-ratio:1.4}
.tile.text-style{min-height:48px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bigbtn{display:flex;gap:10px;align-items:center;width:100%;border:2px dashed var(--line);background:var(--panel);border-radius:12px;padding:12px;font-weight:800;text-align:left}
.bigbtn:hover{border-color:var(--ink)}
.bigbtn .ico{font-size:24px}
.bigbtn small{display:block;font-weight:400;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=search],input[type=url],input[type=number],select,textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%;-webkit-user-select:text;user-select:text}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--ink)}
input[type=color]{width:38px;height:32px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid rgba(0,0,0,.15)}
.sw.on{outline:3px solid var(--sel);outline-offset:1px}
.note{background:#fff8d6;border:1px solid #f1df8b;border-radius:10px;padding:10px;font-size:12.5px;line-height:1.45}
.note kbd{background:#fff;border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11.5px}

#workspace{position:relative;overflow:auto;min-width:0;display:flex;flex-direction:column}
#stageWrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 40px 40px;min-width:max-content}
#stageScaler{position:relative;flex:none}
#page{position:absolute;left:0;top:0;touch-action:none;transform-origin:0 0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 16px 40px rgba(20,20,40,.18);overflow:hidden}
#page.drop{outline:4px dashed var(--sel)}
.pnl-fill,.pnl-clip{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pnl-clip .it{pointer-events:auto}
.pnl-fill img.scene{position:absolute;object-fit:cover;display:block;pointer-events:none}
svg.layer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.it{position:absolute;transform-origin:50% 50%;cursor:move;touch-action:none}
.it > .inner{width:100%;height:100%;pointer-events:none}
.it img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.it svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.it .emo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it .txt{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.it .tc{width:100%;white-space:pre}
.it .txt.editing{pointer-events:auto;-webkit-user-select:text;user-select:text;cursor:text;outline:2px dashed var(--sel);outline-offset:2px}
.it.locked{cursor:default}
.ghost{opacity:.25}
#overlay{position:absolute;left:0;top:0;pointer-events:none}
.selbox{position:absolute;border:2px solid var(--sel);transform-origin:50% 50%;pointer-events:none}
.selbox.panel{border-style:dashed;border-color:#ff7a00}
.h{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--sel);border-radius:50%;pointer-events:auto;touch-action:none;margin:-8px 0 0 -8px}
.selbox.panel .h{border-color:#ff7a00;border-radius:3px}
.h.nw,.h.se{cursor:nwse-resize}.h.ne,.h.sw{cursor:nesw-resize}.h.n,.h.s{cursor:ns-resize}.h.e,.h.w{cursor:ew-resize}
.h.rot{cursor:grab;background:var(--sel);color:#fff;font-size:11px;line-height:12px;text-align:center;width:22px;height:22px;margin:-11px 0 0 -11px}
.psel{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.h.vtx,.h.pbox{border-color:#ff7a00;border-radius:4px;width:18px;height:18px;margin:-9px 0 0 -9px;cursor:move}
.h.vtx{background:#ff7a00;box-shadow:0 0 0 3px #fff}
.pmove{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ff7a00;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:move;box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none}
.h.tail{background:var(--pop);border-color:var(--ink);width:20px;height:20px;margin:-10px 0 0 -10px;cursor:crosshair}
.rotline{position:absolute;left:50%;top:-30px;width:2px;height:28px;background:var(--sel);margin-left:-1px}
button{touch-action:manipulation;-webkit-touch-callout:none}
#workspace{touch-action:pan-x pan-y}
body.touch .h{width:30px;height:30px;margin:-15px 0 0 -15px;border-width:3px}
body.touch .h.rot{width:34px;height:34px;margin:-17px 0 0 -17px;font-size:16px;line-height:28px}
body.touch .rotline{top:-46px;height:44px}
body.touch .h.vtx,body.touch .h.pbox{width:30px;height:30px;margin:-15px 0 0 -15px}
body.touch .h.tail{width:34px;height:34px;margin:-17px 0 0 -17px}
body.touch .pmove{width:50px;height:50px;margin:-25px 0 0 -25px;font-size:24px}
body.touch .tile{-webkit-touch-callout:none}
.tile.armed{transform:scale(1.08);box-shadow:0 0 0 4px var(--sel);border-color:var(--sel)}
.bigbtn.write{background:var(--pop);border:2px solid var(--ink);margin-bottom:10px}
.pastezone{border:2px dashed var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--muted);-webkit-user-select:text;user-select:text;min-height:52px;outline:none}
.pastezone:focus,.pastezone.flash{border-color:var(--sel);background:#eef9ff;color:var(--ink)}
.adjhint{position:absolute;transform:translate(-50%,-50%);background:#14a8e6;color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bigbtn.write.on{background:#14a8e6;color:#fff}
.bigbtn.write.on small{color:#e6f6ff}
a.hbtn{text-decoration:none}
.hbtn.publish{background:#2fc47a;border-color:#2fc47a;color:#08240f;font-weight:800}
.hbtn.publish:hover{filter:brightness(1.06)}
#pubModal .modal{max-width:480px}
.pub-steps{margin:10px 0;font-weight:700}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.libcard{border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:#fff}
.libcard.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--pop)}
.libcard.new{border-style:dashed;justify-content:center;min-height:180px;background:var(--panel);font-size:15px}
.libcard.new .ico{font-size:34px}
.libcard b{font-size:13.5px;line-height:1.2;word-break:break-word}.libcard small{color:var(--muted);font-size:11.5px}
.lthumb{border:0;padding:0;background:var(--panel);border-radius:8px;width:100%;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px}
.lthumb img{max-width:100%;max-height:100%;display:block}
.lcode{font-weight:800;color:#14a8e6!important;letter-spacing:.05em}
.libsec{border-top:1px solid var(--line);padding-top:10px}.libsec h3{margin:4px 0}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:24px;letter-spacing:.12em;background:#fff8d6;border:2px dashed #e0b400;border-radius:10px;padding:4px 12px;display:inline-block}
.cloudstat{font-weight:800;font-size:12.5px;background:#2a2a36;border:1px solid #3a3a48;color:#bfe6ff;border-radius:8px;padding:6px 8px;white-space:nowrap}
.cloudstat.err{color:#ffb3b3}.cloudstat.wait{color:#9aa0ad}
.closep{display:none;position:sticky;top:0;float:right;border:0;background:var(--panel);border-radius:50%;width:36px;height:36px;font-size:16px;z-index:3}
@media (max-width:860px){.closep{display:block}}
.guide{position:absolute;background:#ff2e88;pointer-events:none}

#pagesBar{position:sticky;bottom:0;left:0;display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);overflow-x:auto}
.pg{flex:none;border:2px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-weight:800;display:flex;align-items:center;gap:6px}
.pg.on{border-color:var(--ink);background:var(--pop)}
.pgtools{display:flex;gap:4px;margin-left:auto}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-weight:700;white-space:nowrap}
.mini:hover{border-color:var(--ink)}
.mini.danger:hover{border-color:var(--danger);color:var(--danger)}

#props{background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:14px}
#props h2{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:0 0 10px}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.btnrow{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.btnrow.b3{grid-template-columns:repeat(3,1fr)}
.btnrow.b4{grid-template-columns:repeat(4,1fr)}
.btnrow .mini{padding:7px 4px;font-size:12.5px}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
#confirmModal{z-index:95}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 10px;letter-spacing:.5px}
#charPreview{width:250px;height:340px;background:radial-gradient(circle at 50% 40%,#fff7d6,#ffd96b);border-radius:16px;flex:none;position:sticky;top:0;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
#charModal .modal{max-width:900px}
.charOpts{flex:1;min-width:0}
.charOpts .chips{margin-bottom:8px}
.reader-bg{background:#111}
#reader .modal{background:#1d1d26;color:#fff;max-width:96vw}
#readerImg{max-width:100%;max-height:78vh;display:block;margin:0 auto;border-radius:4px;background:#fff}
#searchRes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
#searchRes button{padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);aspect-ratio:1}
#searchRes img{width:100%;height:100%;object-fit:cover;display:block}
.drag-ghost{position:fixed;pointer-events:none;z-index:200;font-size:40px;opacity:.85;transform:translate(-50%,-50%)}
.drag-ghost img{width:80px;display:block}

@media (max-width:1180px){
  main{grid-template-columns:70px 250px 1fr 240px}
  #projTitle{width:130px}
  .hbtn .t{display:none}
}
@media (max-width:860px){
  main{grid-template-columns:64px 1fr}
  #library{position:fixed;left:64px;top:56px;bottom:0;width:280px;z-index:30;box-shadow:8px 0 30px rgba(0,0,0,.15);display:none}
  #library.open{display:block}
  #props{position:fixed;right:0;top:56px;bottom:52px;width:250px;z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:none}
  #props.open{display:block}
  .logo span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">Comic <span>Lab</span></div>
  <input id="projTitle" type="text" value="Ma BD" aria-label="Titre de la BD">
  <div class="hgroup">
    <button class="hbtn" id="undoBtn" title="Annuler (Ctrl+Z)">↶<span class="t">Annuler</span></button>
    <button class="hbtn" id="redoBtn" title="Rétablir (Ctrl+Y)">↷</button>
  </div>
  <div class="hgroup">
    <button class="hbtn" id="zoomOut" title="Dézoomer">−</button>
    <span id="zoomLbl">100%</span>
    <button class="hbtn" id="zoomIn" title="Zoomer">+</button>
    <button class="hbtn" id="zoomFit" title="Adapter à l'écran">⤢</button>
  </div>
  <div class="spacer"></div>
  <a class="hbtn" id="backWall" hidden>← Mur</a>
  <button class="hbtn publish" id="publishBtn" hidden>📤<span class="t"> Publier sur le mur</span></button>
  <span class="cloudstat" id="cloudStat" hidden></span>
  <button class="hbtn" id="libBtn" title="Mes BD : reprendre une BD, code de reprise">📚<span class="t"> Mes BD</span></button>
  <button class="hbtn" id="readBtn" title="Lire la BD en plein écran">📖<span class="t">Lire</span></button>
  <div class="menu">
    <button class="hbtn" id="fileBtn">📁<span class="t">Projet</span></button>
    <div class="menu-list" id="fileMenu">
      <button data-act="lib">📚 <span>Mes BD<br><small>reprendre une BD, code de reprise</small></span></button>
      <button data-act="save">💾 <span>Enregistrer le projet<br><small>fichier .json à rouvrir plus tard</small></span></button>
      <button data-act="open">📂 <span>Ouvrir un projet<br><small>un fichier .json enregistré avant</small></span></button>

function starPath(cx, cy, R, r, n, seed = 0) {
  const rr = seed ? rng(seed) : null; let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = Math.PI * i / n - Math.PI / 2, k = i % 2 ? r : R * (rr ? .82 + rr() * .3 : 1);
    d += (i ? 'L' : 'M') + (cx + k * Math.cos(a)).toFixed(1) + ' ' + (cy + k * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
function ellPath(cx, cy, rx, ry) { return `M${cx - rx} ${cy} a${rx} ${ry} 0 1 0 ${2 * rx} 0 a${rx} ${ry} 0 1 0 ${-2 * rx} 0Z`; }

  try { const o = JSON.parse(await f.text()); if (!o.doc?.pages) throw 0; await flushSave(); openDoc(o.doc, o.assets, null); await saveProject(); toast('Projet ouvert ✔ (ajouté à 📚 Mes BD)'); }
  catch (err) { toast('Ce fichier n’est pas un projet Comic Lab.'); }
});

/* ================= Interface générale ================= */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3200); }
function closeMenus() { $$('.menu-list').forEach(m => m.classList.remove('open')); }
$('#fileBtn').onclick = e => { e.stopPropagation(); const o = $('#fileMenu').classList.contains('open'); closeMenus(); $('#fileMenu').classList.toggle('open', !o); };
$('#exportBtn').onclick = e => { e.stopPropagation(); const o = $('#exportMenu').classList.contains('open'); closeMenus(); $('#exportMenu').classList.toggle('open', !o); };
$('#fileMenu').onclick = e => { const b = e.target.closest('[data-act]'); if (b) fileAct(b.dataset.act); };
$('#exportMenu').onclick = e => { const b = e.target.closest('[data-act]'); if (b) exportAct(b.dataset.act); };
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
function askConfirm(title, text, yes) { $('#confirmTitle').textContent = title; $('#confirmText').textContent = text; $('#confirmModal').classList.add('open'); $('#confirmYes').onclick = () => { $('#confirmModal').classList.remove('open'); yes(); }; $('#confirmNo').onclick = () => $('#confirmModal').classList.remove('open'); }
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#projTitle').addEventListener('change', e => { const c = censor(e.target.value); if (c !== e.target.value) { e.target.value = c; toast('🙊 Oups ! Les gros mots sont interdits : remplacés par #@$%!'); } doc.title = c; commit(); });
function setTab(t) { tab = t; $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); renderLibrary(); $('#library').scrollTop = 0; if (innerWidth <= 860) $('#library').classList.add('open'); }
$('#rail').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; if (innerWidth <= 860 && tab === b.dataset.tab && $('#library').classList.contains('open')) { $('#library').classList.remove('open'); return; } setTab(b.dataset.tab); });
function fitZoom() { if (!zoomFitMode) return; const w = $('#workspace'), pg = page(); zoom = clamp(Math.min((w.clientWidth - 80) / pg.w, (w.clientHeight - 110) / pg.h), .2, 1.6); }
function setZoom(z) { zoomFitMode = false; zoom = clamp(z, .2, 3); renderPage(); renderOverlay(); $('#zoomLbl').textContent = Math.round(zoom * 100) + '%'; }
$('#zoomIn').onclick = () => setZoom(Math.round((zoom + .1) * 10) / 10);
$('#zoomOut').onclick = () => setZoom(Math.round((zoom - .1) * 10) / 10);
$('#zoomFit').onclick = () => { zoomFitMode = true; fitZoom(); render(); };
$('#workspace').addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); } }, { passive: false });
addEventListener('resize', () => { if (zoomFitMode) { fitZoom(); renderPage(); renderOverlay(); $('#zoomLbl').textContent = Math.round(zoom * 100) + '%'; } });
function render() { renderPage(); renderOverlay(); renderPagesBar(); renderProps(); renderLibrary(); $('#zoomLbl').textContent = Math.round(zoom * 100) + '%'; }

/* ================= BD d'exemple ================= */
function demoDoc() {
  const pg = newPage('a4p', 6); // planche « Action »
  pg.pstyle = { ...PSTYLE_DEFAULT, ...PSTYLES[2][1] }; pg.panels.forEach(p => Object.assign(p, PSTYLES[2][1])); pg.bg = '#ffd23f';
  const [A, B, C, D, E] = pg.panels;
  A.scene = { k: 'lockers' }; B.scene = { k: 'speed', c1: '#ffffff', c2: '#17171f' }; C.scene = { k: 'classroom' }; D.scene = { k: 'vignette', c1: '#3a1d5c', c2: '#0b0716' }; E.scene = { k: 'rays', c1: '#ffd23f', c2: '#ff8a00' };
  const items = [];
  const put = o => { const it = { id: uid(), rot: 0, op: 1, flip: false, lock: false, abs: 1, clipMode: CLIPPABLE[o.type] ? 'auto' : 'off', ...o }; items.push(it); return it; };
  const ch = (p, preset, fx, fy, hh, extra = {}) => { const b = panelBBox(p), pp = { ...CHAR_DEFAULT, ...CHAR_PRESETS.find(c => c.name === preset).p, ...extra }, h = b.h * hh, w = h * charAspect(pp); return put({ type: 'char', p: pp, w, h, x: b.x + fx * b.w - w / 2, y: b.y + fy * b.h - h, clip: p.id }); };
  const bub = (p, k, text, fx, fy, w, h, tfx, tfy, more = {}) => { const b = panelBBox(p), s = bubbleSpec(k); delete s.autoEdit; const x = b.x + fx * b.w, y = b.y + fy * b.h; return put({ ...s, text, w, h, x, y, tx: b.x + tfx * b.w - x, ty: b.y + tfy * b.h - y, tx2: w * .7, ty2: h + 40, ...more }); };
  let bA = panelBBox(A), bB = panelBBox(B), bC = panelBBox(C), bD = panelBBox(D), bE = panelBBox(E);
  ch(A, 'Tom', .3, 1.04, .82, { pose: 'run', eyes: 'wide', brows: 'sad', mouth: 'wavy', fx: ['sweat'], look: 'r' });
  bub(A, 'caption', 'Monday, 8:59 a.m.', .03, .04, 250, 52, 0, 0, { size: 24 });
  bub(A, 'scared', 'Oh no! I’m late again!', .5, .12, 230, 120, .38, .45);
  put({ type: 'deco', k: 'speed', c1: '#17171f', w: 120, h: 70, x: bA.x + 10, y: bA.y + bA.h * .55, clip: A.id, flip: true });
  ch(B, 'Captain Max', .5, 1.02, .9, { pose: 'cheer', eyes: 'star', mouth: 'grin', fx: ['sparkle'] });
  put({ type: 'text', text: 'WHOOSH!', font: 'Bangers', size: 60, color: '#14a8e6', sc: '#17171f', sw: 5, w: 290, h: 84, x: bB.x + bB.w * .5 - 145, y: bB.y + 10, rot: -10, align: 'center', shadowT: true, shadowTC: '#17171f' });
  ch(C, 'Mrs Smith', .2, 1.03, .85, { pose: 'hips', eyes: 'angry', brows: 'angry', mouth: 'flat', look: 'r', body: 'full' });
  ch(C, 'Mia', .62, 1.03, .7, { pose: 'idle', eyes: 'normal', mouth: 'smile', look: 'l' });
  ch(C, 'Sam', .86, 1.03, .7, { pose: 'idle', eyes: 'happy', mouth: 'laugh', look: 'l' });
  bub(C, 'speech', 'Tom! Where is your homework?', .3, .06, 260, 120, .27, .4, { t2: false });
  ch(D, 'Tom', .5, 1.02, .78, { body: 'bust', pose: 'shrug', eyes: 'sad', brows: 'sad', mouth: 'wavy', fx: ['shy', 'sweat'] });
  bub(D, 'thought', 'My dog ate it…?', .05, .05, 200, 120, .3, .55);
  ch(E, 'Rex', .55, 1.03, .8, { pose: 'cheer', eyes: 'happy', mouth: 'tongue', body: 'full' });
  bub(E, 'shout', 'WOOF!', .03, .05, 170, 110, .4, .5);
  put({ type: 'emoji', ch: '📄', w: 54, h: 54, x: bE.x + bE.w * .78, y: bE.y + bE.h * .58, rot: 20, clip: E.id });
  pg.items = items;
  return { title: 'Tom is late!', pages: [pg] };
}

/* ================= Démarrage ================= */
(async function init() {
  let list = [];
  try { list = await IDB.all(); } catch (e) { idbOk = false; }
  // reprise de l'ancienne sauvegarde (une seule BD)
  try { const s = JSON.parse(localStorage.getItem('comiclab-v2') || 'null'); if (s && s.doc && s.doc.pages?.length && idbOk && !list.length) { openDoc(s.doc, s.assets, null); await saveProject(); list = await IDB.all(); localStorage.removeItem('comiclab-v2'); } else if (s && !idbOk) { doc = migrateDoc(s.doc); assets = s.assets || {}; } } catch (e) { }
  const curId = localStorage.getItem('comiclab-cur'), rec = list.find(r => r.id === curId) || list.sort((a, b) => b.updatedAt - a.updatedAt)[0];
  if (rec && !doc) { openDoc(rec.doc, rec.assets, rec); }
  if (!doc) { doc = WALL ? { title: 'Ma BD', pages: [newPage('a4p', 6)] } : demoDoc(); $('#projTitle').value = doc.title || ''; lastSnap = snapshot(); updateUndo(); fitZoom(); render(); }
  document.fonts?.ready.then(() => { textLayoutCache.clear(); renderPage(); });
  const code = QS.get('code');
  if (code) { try { await cloudLoad(code); if (QS.get('post')) toast('✏️ Modifie ta BD puis republie-la : l’ancienne version sera remplacée sur le mur.'); } catch (e) { toast('⚠️ ' + cloudErr(e)); } }
  else if (WALL && list.length) openLib(true);
})();
</script>
