<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11131f">
<title>English Walls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bangers&family=Caveat:wght@400;700&family=Fredoka:wght@500;600;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1f2335;--muted:#6b7086;--scale:1;--r:18px;--bar:rgba(17,19,32,.82);--accent:#e63946}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);background:#eef1f6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand{font-family:'Fredoka','Nunito',sans-serif;font-weight:600}
a{color:#2563eb}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--muted)}.small{font-size:.88rem}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;border-radius:999px;padding:.7em 1.2em;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.14);text-decoration:none;white-space:nowrap;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(.95)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.blue{background:#2563eb;color:#fff}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.small{padding:.45em .85em;font-size:.88rem}
.btn.wide{width:100%}
.btn.google{background:#fff;border:1.5px solid #dadce0;box-shadow:none}
.btn.google svg{width:20px;height:20px}
input,textarea,select{font:inherit;color:var(--ink);padding:.7em .85em;border:1.5px solid #d6dae5;border-radius:12px;width:100%;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:#6c8cff;box-shadow:0 0 0 3px rgba(108,140,255,.2)}
textarea{min-height:120px;resize:vertical}
input[type=range]{padding:0;border:0;box-shadow:none;accent-color:var(--accent)}
label.f{display:block;font-weight:800;font-size:.8rem;margin:1em 0 .35em;color:#4a5068;text-transform:uppercase;letter-spacing:.04em}
label.chk{display:flex;align-items:center;gap:.6em;margin:.8em 0;font-weight:700;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:end}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:500;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:#1f2335;color:#fff;padding:.8em 1.1em;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease;text-align:center}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---------- accueil ---------- */
.home{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.home-card{width:min(440px,100%);background:rgba(255,255,255,.97);border-radius:26px;padding:30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.home-card h2{margin:.4em 0 0;text-align:center}
.brand{font-size:1.45rem;display:flex;align-items:center;gap:.4em}
.brand.big{font-size:2.1rem;justify-content:center}
.tag{text-align:center;color:var(--muted);margin:.3em 0 1.2em}
.copy-row{display:flex;gap:8px}
.copy-row input{flex:1;min-width:0}
#code{text-transform:uppercase;letter-spacing:.2em;font-weight:800;font-size:1.2rem;text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:.78rem;text-transform:uppercase;margin:1.4em 0 1em}
.or::before,.or::after{content:'';flex:1;height:1px;background:#e2e5ee}
.home form .btn.wide{margin-top:12px}

/* ---------- tableau de bord ---------- */
.dash{min-height:100%;background:#f3f4f8}
.dash-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;background:#fff;box-shadow:0 1px 0 #e6e8ef;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;font-weight:700}
.me img{width:34px;height:34px;border-radius:50%}
.dash-main{max-width:1200px;margin:0 auto;padding:26px 22px 80px}
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.dash-head h1{margin:0;font-size:2rem}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.wtile{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(20,25,50,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.wtile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,25,50,.16)}
.wt-bg{height:130px}
.wt-info{padding:12px 14px 14px}
.wt-info b{display:block;font-family:Fredoka;font-size:1.15rem}
.wt-info small{color:var(--muted)}
.wt-meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;background:#eef1f8;padding:.2em .55em;border-radius:8px;letter-spacing:.1em}
.mdot{width:12px;height:12px;border-radius:50%}.m-open{background:#16a34a}.m-review{background:#f59e0b}.m-closed{background:#dc2626}
.demo-tag{font-size:.7rem;background:#fde68a;color:#92400e;padding:.2em .6em;border-radius:99px;font-family:Nunito;font-weight:800}
.empty-dash{grid-column:1/-1;text-align:center;padding:50px 20px;background:#fff;border-radius:20px}

/* ---------- mur ---------- */
.board{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;z-index:30;flex-wrap:wrap}
.titles{flex:1 1 200px;min-width:0;padding:0 6px}
.titles h1{margin:0;font-size:calc(1.3rem*var(--scale));line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles .sub{font-size:calc(.9rem*var(--scale));opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:12px;height:42px;min-width:42px;padding:0 .75em;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:.35em;font-size:.95rem;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.24)}
.tb-btn.on{background:#fff;color:#1f2335}
.tb-btn.pending{background:#f59e0b;color:#231400;animation:pp 1.6s infinite}
@keyframes pp{50%{box-shadow:0 0 0 5px rgba(245,158,11,.35)}}
.tb-group{display:inline-flex;align-items:center;gap:4px}
.seg-lbl{font-size:.72rem;opacity:.75;font-weight:800;margin-right:2px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#fff;border-radius:9px;height:36px;padding:0 .7em;font-weight:800;display:inline-flex;align-items:center;gap:.3em;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.14)}
.seg button.on.m-open{background:#16a34a}.seg button.on.m-review{background:#f59e0b;color:#231400}.seg button.on.m-closed{background:#dc2626}
.status-strip{background:rgba(255,255,255,.93);color:#1f2335;text-align:center;font-weight:800;padding:.5em 1em;font-size:calc(.95rem*var(--scale));z-index:25;display:flex;align-items:center;justify-content:center;gap:.8em;flex-wrap:wrap}
.status-strip.preview{background:#1d4ed8;color:#fff}
.status-strip .btn{padding:.35em .9em;font-size:.85rem}
.scroll{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
@media(max-width:700px){.lbl{display:none}.zoom{display:none!important}.seg-lbl{display:none}.titles{flex-basis:100%;order:-1;padding:2px 4px 4px}}

.lanes{display:flex;gap:calc(16px*var(--scale));padding:calc(18px*var(--scale));align-items:flex-start;width:max-content;min-width:100%}
.lane{width:calc(330px*var(--scale));flex:none;display:flex;flex-direction:column;gap:calc(12px*var(--scale))}
.lane-head{background:rgba(255,255,255,.94);border-radius:16px;padding:.5em .55em .5em .9em;font-family:Fredoka;font-weight:600;font-size:calc(1.2rem*var(--scale));display:flex;align-items:center;gap:.4em;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.lane-title{flex:1;min-width:0;overflow-wrap:anywhere}
.lane-add{border:0;background:#1f2335;color:#fff;border-radius:10px;width:36px;height:36px;font-size:1.2rem;flex:none}
.lane-list{display:flex;flex-direction:column;gap:calc(12px*var(--scale));min-height:90px;padding-bottom:40px}
.lane-new{flex:none;width:calc(230px*var(--scale));border:2.5px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.25);color:#fff;font-weight:800;border-radius:16px;padding:1em;text-shadow:0 1px 3px rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.f-wall .list{column-width:calc(300px*var(--scale));column-gap:calc(16px*var(--scale));padding:calc(18px*var(--scale))}
.f-wall .card{display:inline-block;width:100%;margin-bottom:calc(16px*var(--scale));break-inside:avoid;vertical-align:top}
.f-grid .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(290px*var(--scale)),1fr));gap:calc(16px*var(--scale));padding:calc(18px*var(--scale));align-items:start}
.f-grid .card.sz-L{grid-column:span 2}
.f-stack .list{display:flex;flex-direction:column;gap:14px;padding:14px;max-width:640px;margin:0 auto}
.f-free .canvas{position:relative;min-width:100%;min-height:100%}
.f-free .card{position:absolute}
@media(max-width:700px){.lanes{flex-direction:column;width:100%;padding:12px}.lane{width:100%}.lane-new{width:100%}.f-grid .card.sz-L{grid-column:auto}.f-wall .list,.f-grid .list{padding:12px}.lane-list{min-height:40px;padding-bottom:10px}}
.empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);padding:1.2em 1.6em;border-radius:20px;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90%;font-size:calc(1.05rem*var(--scale))}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2.3rem;box-shadow:0 10px 28px rgba(230,57,70,.5);z-index:40;display:flex;align-items:center;justify-content:center;line-height:1}

/* ---------- cartes ---------- */
.card{position:relative;background:var(--cbg,#fff);border-radius:var(--r);box-shadow:0 6px 22px rgba(12,16,35,.22);overflow:hidden;container-type:inline-size;font-size:calc(1rem*var(--scale));color:var(--ink)}
.card.dark{color:#f3f4f8}.card.dark .card-foot{color:#b8bdd0}.card.dark .ct,.card.dark .fbtn{background:rgba(255,255,255,.14)}
.card-head{display:flex;align-items:center;gap:6px;padding:6px 6px 0 8px;min-height:30px}
.drag{cursor:grab;font-size:1.25em;opacity:.45;padding:0 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.drag:active{cursor:grabbing}
.card-tools{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .card-tools,.touch .card-tools,.card:focus-within .card-tools{opacity:1}
.ct{border:0;background:rgba(0,0,0,.07);border-radius:9px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;text-decoration:none;color:inherit}
.ct:hover{background:rgba(0,0,0,.14)}
.badge{font-size:.75em;font-weight:800;padding:.25em .6em;border-radius:99px;white-space:nowrap}
.b-hidden{background:#334155;color:#fff}.b-pend{background:#fef3c7;color:#92400e}
.card-body{padding:.55em 1em .9em}
.card-head+.card-body{padding-top:.2em}
.t-text .card-body,.t-highlight .card-body{font-size:calc(1em*var(--fs,1))}
.card h3{margin:.15em 0 .35em;font-size:1.25em;line-height:1.2;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.pimg{display:block;width:calc(100% + 2em);margin:-.55em -1em .7em;max-height:520px;object-fit:cover;cursor:zoom-in}
.card-head+.card-body .pimg{margin-top:.15em}
.card-foot{display:flex;align-items:center;gap:6px;padding:0 .8em .7em;font-size:.88em;color:var(--muted)}
.card-foot .sp{flex:1}
.who{font-weight:800}
.fbtn{border:0;background:rgba(0,0,0,.05);border-radius:99px;padding:.3em .7em;font-weight:800;font-size:.95em}
.fbtn.on{background:#ffe4e6}
.card.is-hidden{opacity:.5;outline:3px dashed #475569;outline-offset:-3px}
.card.is-pending{outline:3px dashed #f59e0b;outline-offset:-3px}
.card.hl{border:calc(6px*var(--scale)) solid var(--hl);box-shadow:0 0 0 5px color-mix(in srgb,var(--hl) 22%,transparent),0 10px 30px rgba(0,0,0,.28)}
.hl-inner{text-align:center}
.hl-icon{font-size:2.2em;line-height:1.1}
.hl h3{color:var(--hl);font-size:1.5em}
.hl .txt{font-weight:800;font-size:1.2em}
.card.pulse{animation:hlp 2.2s ease-in-out infinite}
@keyframes hlp{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--hl) 30%,transparent),0 10px 30px rgba(0,0,0,.28)}}
audio{width:100%;margin:.3em 0;display:block}
.plink{display:block;border-radius:12px;background:rgba(0,0,0,.05);text-decoration:none;color:inherit;margin-bottom:.4em;overflow:hidden}
.plink:hover{background:rgba(0,0,0,.08)}
.pv-img{display:block;width:100%;aspect-ratio:1.91/1;object-fit:cover;background:rgba(0,0,0,.06)}
.pv-row{display:flex;align-items:center;gap:.7em;padding:.7em}
.pv-fav{width:28px;height:28px;border-radius:7px;flex:none}
.pv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15em}
.pv-t b{overflow-wrap:anywhere;line-height:1.25}
.pv-d{opacity:.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.pv-u{opacity:.55}
.plink i{font-style:normal;font-weight:800}
#pv-box{margin-top:10px}#pv-box a{pointer-events:none}#pv-box .pv-img{max-height:200px}
.txt.rich{white-space:normal}
.rich ul,.rich ol{margin:.2em 0;padding-left:1.4em}
.rte{border:1.5px solid #d6dae5;border-radius:12px;background:#fff}
.rte:focus-within{border-color:#6c8cff;box-shadow:0 0 0 3px rgba(108,140,255,.2)}
.rte-bar{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid #eef0f5;align-items:center;background:#fafbfd;border-radius:12px 12px 0 0}
.rte-bar select{width:auto;padding:.35em .5em;border-radius:8px;font-size:.88rem;max-width:170px}
.rte-bar button{border:0;background:transparent;border-radius:8px;min-width:34px;height:34px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;color:#1f2335;padding:0 .3em}
.rte-bar button:hover{background:#eef1f8}.rte-bar button.on{background:#1f2335;color:#fff}
.rte-bar svg{width:18px;height:18px}
.rte-bar .sep{width:1px;height:24px;background:#e2e5ee;margin:0 3px}
.rte-pw{position:relative;display:inline-flex}
.rte-pop{position:absolute;top:100%;left:0;z-index:10;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:8px;display:grid;grid-template-columns:repeat(5,30px);gap:6px}
.rte-pop[hidden]{display:none}
.rte-bar .rte-pop button{width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.12)}
.rte-bar .rte-pop button:hover{background:var(--c);transform:scale(1.12)}
.rte-bar .rte-pop button.none{background:#fff;font-size:.75rem}
.rte-area{min-height:140px;max-height:45vh;overflow:auto;padding:.8em 1em;outline:none;font-size:1.05rem;line-height:1.5}
.rte-area:empty::before{content:attr(data-ph);color:#9aa0b4}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.emb-bar{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:.5em}
.emb-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emb{border-radius:12px;overflow:hidden;background:#f1f3f8;height:calc(460px*var(--scale))}
.sz-S .emb{height:calc(300px*var(--scale))}.sz-L .emb{height:calc(640px*var(--scale))}
.emb iframe{width:100%;height:100%;border:0;display:block}
.card.fixed-h{display:flex;flex-direction:column}
.card.fixed-h .card-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.card.fixed-h .emb{flex:1;height:auto;min-height:0}
.card.fixed-h .vid{flex:1;padding-top:0}
.card.fixed-h.widget .card-body{justify-content:center}
.rz{position:absolute;right:2px;bottom:2px;width:30px;height:30px;cursor:nwse-resize;touch-action:none;z-index:3;border-radius:8px;display:flex;align-items:flex-end;justify-content:flex-end;opacity:0;transition:opacity .15s}
.rz.v{cursor:ns-resize}
.rz::after{content:'';width:12px;height:12px;margin:6px;border-right:3px solid rgba(0,0,0,.45);border-bottom:3px solid rgba(0,0,0,.45);border-radius:0 0 4px 0}
.rz:hover{background:rgba(0,0,0,.08)}
.card:hover .rz,.touch .rz,.card.fixed-h .rz{opacity:1}
.card.dark .rz::after{border-color:rgba(255,255,255,.65)}
.card.fixed-h .pimg{flex:1;min-height:0;max-height:none;object-fit:cover}
.card-body.fit{overflow:hidden!important}
.card-body.fit .txt,.card-body.fit h3{overflow-wrap:normal;word-break:normal}
.card-body.fit a{overflow-wrap:anywhere;word-break:break-all}
.card.dragging{box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:9999!important}
.is-dragging iframe{pointer-events:none}
.ghost{opacity:.35}.chosen{box-shadow:0 18px 40px rgba(0,0,0,.35)}
.w-title{font-family:Fredoka;font-weight:600;text-align:center;font-size:1.15em;margin-bottom:.1em}
.w-digits{font-family:Fredoka;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.05;font-size:clamp(30px,24cqw,320px)}
.w-digits small{font-size:.38em;opacity:.7}
.t-clock .w-digits{font-size:clamp(30px,21cqw,300px)}
.w-date{text-align:center;font-weight:800;font-size:clamp(14px,5.4cqw,60px);opacity:.78;margin-top:.15em}
.w-bar{height:10px;border-radius:99px;background:rgba(0,0,0,.09);overflow:hidden;margin:.5em 0 .2em}
.w-bar i{display:block;height:100%;background:#16a34a;border-radius:99px;transition:width .2s linear}
.card.warn .w-bar i{background:#f59e0b}
.card.done{animation:blink 1s steps(2) infinite}
.card.done .w-digits{color:#dc2626}
@keyframes blink{50%{background:#fecaca}}
.w-ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:.5em}
.wb{border:0;background:rgba(0,0,0,.07);border-radius:10px;min-width:42px;height:40px;font-weight:800;padding:0 .6em}
.wb.big{background:#1f2335;color:#fff;min-width:64px;font-size:1.1em}
.card.dark .wb{background:rgba(255,255,255,.14)}

/* ---------- fenêtres ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,12,28,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.modal-head h2{margin:0;flex:1;font-size:1.35rem}
.x{border:0;background:#f1f3f8;border-radius:50%;width:38px;height:38px;font-size:1rem;flex:none}
.modal-body{padding:4px 18px 14px;overflow:auto}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px 16px;border-top:1px solid #eef0f5;flex-wrap:wrap}
@media(max-width:600px){.modal-back{align-items:flex-end;padding:0}.modal,.modal.wide{width:100%;border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh}}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1.5px solid #e1e4ee;background:#fff;border-radius:99px;padding:.5em .9em;font-weight:800}
.chip.on{background:#1f2335;color:#fff;border-color:#1f2335}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:36px;height:36px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.15);cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 3px #fff,0 0 0 6px #1f2335}
.drop{border:2.5px dashed #cfd5e3;border-radius:16px;padding:16px;text-align:center;cursor:pointer;margin-top:10px;color:var(--muted);font-weight:800}
.drop img{max-width:100%;max-height:260px;border-radius:10px}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn.recording{background:#dc2626;animation:pp 1s infinite}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tabs button{border:0;background:#f1f3f8;border-radius:99px;padding:.5em 1em;font-weight:800}
.tabs button.on{background:#1f2335;color:#fff}
.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fmt{position:relative}
.fmt input{position:absolute;opacity:0}
.fmt span{display:block;border:2px solid #e1e4ee;border-radius:14px;padding:.7em;cursor:pointer;height:100%}
.fmt small{display:block;color:var(--muted);font-weight:600;margin-top:.2em}
.fmt input:checked+span{border-color:var(--accent);background:#fff1f2}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.bg-tile{height:84px;border-radius:14px;border:3px solid transparent;position:relative;overflow:hidden;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bg-tile span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.72rem;font-weight:800;padding:14px 6px 5px;text-align:left}
.bg-tile.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,57,70,.3)}
.sec-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sec-row input{flex:1}
.act-list{display:grid;gap:10px;margin-top:10px}
.act-list .btn{justify-content:flex-start}
.share{text-align:center}
.code-big{font-family:ui-monospace,Menlo,monospace;font-size:3.2rem;font-weight:800;letter-spacing:.18em;margin:.1em 0}
.qr{display:flex;justify-content:center;margin:16px 0}
.qr img,.qr canvas{border:12px solid #fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);max-width:100%;height:auto}
.modal.big-share{width:min(980px,100%)}
.modal.big-share .code-big{font-size:5rem}
.tray{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:150;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.tray-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #eef0f5;gap:10px}
.tray-head h3{flex:1;margin:0}
.tray-actions{padding:8px 16px 0}
.tray-list{overflow:auto;padding:12px 16px 30px;display:flex;flex-direction:column;gap:12px}
.tray-item{border:1.5px solid #eceef4;border-radius:16px;padding:12px}
.ti-meta{font-size:.9rem;margin-bottom:6px}
.ti-prev{font-size:.95rem;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.ti-prev img{max-width:100%;border-radius:10px;max-height:160px}
.ti-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cm-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin-bottom:12px}
.cm{background:#f4f6fa;border-radius:14px;padding:.6em 2.6em .6em .8em;position:relative;overflow-wrap:anywhere}
.cm b{font-size:.85rem;display:block}
.cm .ct{position:absolute;right:6px;top:6px;width:28px;height:28px;min-width:28px}
.cm-form{display:flex;gap:8px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:1.4rem;color:#6b7086}

    document.execCommand('insertHTML', false, html ? sanitizeHTML(html) : esc(e.clipboardData?.getData('text/plain') || '').replace(/\n/g, '<br>'));
  });
  wrap.addEventListener('mousedown', e => { if (!e.target.closest('.rte-pw')) $$('.rte-pop', wrap).forEach(p => p.hidden = true); });
}

/* ---------------- aperçus de liens (vignettes) ---------------- */
const PV_CACHE = new Map();
async function fetchPreview(url) {
  const sig = ms => (window.AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);
  const okImg = u => /^https:\/\//i.test(u || '') ? String(u).slice(0, 1500) : null;
  try {
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url), { signal: sig(7000) });
    if (r.ok) { const j = await r.json(); const x = j?.data; if (j.status === 'success' && x && (x.title || x.image?.url)) return { title: String(x.title || '').slice(0, 200), desc: String(x.description || '').slice(0, 300), img: okImg(x.image?.url), site: String(x.publisher || '').slice(0, 80) }; }
  } catch { }
  try {
    const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url), { signal: sig(5000) });
    const j = await r.json();
    if (!j.error && (j.title || j.thumbnail_url)) return { title: String(j.title || '').slice(0, 200), desc: String(j.author_name || '').slice(0, 300), img: okImg(j.thumbnail_url), site: String(j.provider_name || '').slice(0, 80) };
  } catch { }
  return null;
}
function getPreview(url) { if (!PV_CACHE.has(url)) PV_CACHE.set(url, fetchPreview(url)); return PV_CACHE.get(url); }
function linkCardHTML(url, pv, title) {
  pv = pv || {}; const h = hostOf(url);
  const img = /^https:\/\//i.test(pv.img || '') ? `<img class="pv-img" src="${esc(pv.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<a class="plink" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${img}<span class="pv-row"><img class="pv-fav" src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(h)}" alt="" onerror="this.remove()"><span class="pv-t"><b>${esc(title || pv.title || h)}</b>${pv.desc ? `<small class="pv-d">${esc(pv.desc)}</small>` : ''}<small class="pv-u">${esc(pv.site ? pv.site + ' · ' : '')}${esc(shortUrl(url))}</small></span><i>↗</i></span></a>`;
}

/* ---------------- stockage Firebase ---------------- */
async function makeFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}`;
  const [A, Au, F] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
  const app = A.initializeApp(firebaseConfig);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  const { doc, collection, query, where, onSnapshot, setDoc, updateDoc, deleteDoc, addDoc, getDoc, getDocs, writeBatch, deleteField, increment } = F;
  const wallRef = id => doc(db, 'walls', id), postsCol = w => collection(db, 'walls', w, 'posts'), postRef = (w, p) => doc(db, 'walls', w, 'posts', p), cmCol = (w, p) => collection(db, 'walls', w, 'posts', p, 'comments');
  const mapU = u => u ? { uid: u.uid, anonymous: u.isAnonymous, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '' } : null;
  const onErr = e => { console.error(e); toast(errMsg(e), 'err'); };
  const docs = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  async function chunked(items, fn) { for (let i = 0; i < items.length; i += 400) { const b = writeBatch(db); items.slice(i, i + 400).forEach(it => fn(b, it)); await b.commit(); } }
  return {
    kind: 'firebase',
    onAuth: cb => Au.onAuthStateChanged(auth, u => cb(mapU(u))),
    signInGoogle: () => Au.signInWithPopup(auth, new Au.GoogleAuthProvider()),
    async signInStudent() { if (!auth.currentUser) await Au.signInAnonymously(auth); return mapU(auth.currentUser); },
    signOut: () => Au.signOut(auth),
    watchMyWalls: (uid, cb) => onSnapshot(query(collection(db, 'walls'), where('ownerUid', '==', uid)), s => cb(docs(s)), onErr),
    wallExists: async id => (await getDoc(wallRef(id))).exists(),
    createWall: (id, data) => setDoc(wallRef(id), data),
    updateWall: (id, patch) => updateDoc(wallRef(id), patch),
    async deleteWall(id) { const ps = await getDocs(postsCol(id)); await chunked(ps.docs.map(d => d.ref), (b, ref) => b.delete(ref)); await deleteDoc(wallRef(id)); },
    watchWall: (id, cb, err) => onSnapshot(wallRef(id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err || onErr),
    watchPosts(w, { owner, uid }, cb) {
      if (owner) return onSnapshot(postsCol(w), s => cb(docs(s)), onErr);
      const a = new Map(), b = new Map();
      const out = () => cb([...new Map([...a, ...b]).values()]);
      const set = m => s => { m.clear(); s.forEach(d => m.set(d.id, { id: d.id, ...d.data() })); out(); };
      const u1 = onSnapshot(query(postsCol(w), where('status', '==', 'approved'), where('hidden', '==', false)), set(a), onErr);
      const u2 = onSnapshot(query(postsCol(w), where('authorUid', '==', uid)), set(b), onErr);
      return () => { u1(); u2(); };
    },
    addPost: async (w, data) => (await addDoc(postsCol(w), data)).id,
    updatePost: (w, p, patch) => updateDoc(postRef(w, p), patch),
    deletePost: (w, p) => deleteDoc(postRef(w, p)),
    batchUpdate: (w, ids, patch) => chunked(ids, (b, id) => b.update(postRef(w, id), patch)),
    batchDelete: (w, ids) => chunked(ids, (b, id) => b.delete(postRef(w, id))),
    toggleLike: (w, p, uid, on) => updateDoc(postRef(w, p), { [`likes.${uid}`]: on ? true : deleteField() }),
    watchComments: (w, p, cb) => onSnapshot(cmCol(w, p), s => cb(docs(s)), onErr),
    async addComment(w, p, data) { await addDoc(cmCol(w, p), data); await updateDoc(postRef(w, p), { cc: increment(1) }).catch(() => {}); },
    async deleteComment(w, p, c) { await deleteDoc(doc(db, 'walls', w, 'posts', p, 'comments', c)); await updateDoc(postRef(w, p), { cc: increment(-1) }).catch(() => {}); },
    async getTeacher(uid) { const s = await getDoc(doc(db, 'teachers', uid)); return s.exists() ? s.data() : { games: [] }; },
    saveTeacher: (uid, data) => setDoc(doc(db, 'teachers', uid), data, { merge: true }),
  };
}

function makeDemoStore() {
  const KEY = 'ew-demo-v1';
  let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch { }
  if (!db || !db.walls) { db = { walls: {}, posts: {}, comments: {}, teachers: {} }; seedDemo(db); }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { } };
  const emit = () => { save(); setTimeout(() => subs.forEach(f => f()), 0); };
  const sub = fn => { subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); };
  const user = { uid: 'demo-prof', anonymous: false, name: 'Mr G (démo)', email: '', photo: '' };
  return {
    kind: 'demo',
    onAuth: cb => { setTimeout(() => cb(user), 0); return () => { }; },
    signInGoogle: async () => { }, signInStudent: async () => user, signOut: async () => { localStorage.removeItem(KEY); location.href = location.pathname; },
    watchMyWalls: (uid, cb) => sub(() => cb(Object.values(db.walls).filter(w => w.ownerUid === uid).map(clone))),
    wallExists: async id => !!db.walls[id],
    createWall: async (id, data) => { db.walls[id] = { id, ...clone(data) }; emit(); },
    updateWall: async (id, patch) => { Object.entries(clone(patch)).forEach(([k, v]) => setPath(db.walls[id], k, v)); emit(); },
    deleteWall: async id => { delete db.walls[id]; Object.keys(db.posts).forEach(k => { if (db.posts[k].wallId === id) delete db.posts[k]; }); emit(); },
    watchWall: (id, cb) => sub(() => cb(db.walls[id] ? clone(db.walls[id]) : null)),
    watchPosts: (w, o, cb) => sub(() => cb(Object.values(db.posts).filter(p => p.wallId === w).map(clone))),
    addPost: async (w, data) => { const id = 'p' + genId(); db.posts[id] = { id, wallId: w, ...clone(data) }; emit(); return id; },
    updatePost: async (w, p, patch) => { if (!db.posts[p]) return; Object.entries(clone(patch)).forEach(([k, v]) => setPath(db.posts[p], k, v)); emit(); },
    deletePost: async (w, p) => { delete db.posts[p]; emit(); },
    batchUpdate: async (w, ids, patch) => { ids.forEach(id => db.posts[id] && Object.assign(db.posts[id], clone(patch))); emit(); },
    batchDelete: async (w, ids) => { ids.forEach(id => delete db.posts[id]); emit(); },
    toggleLike: async (w, p, uid, on) => { const x = db.posts[p]; if (!x) return; x.likes = x.likes || {}; if (on) x.likes[uid] = true; else delete x.likes[uid]; emit(); },
    watchComments: (w, p, cb) => sub(() => cb(Object.values(db.comments).filter(c => c.postId === p).map(clone))),
    addComment: async (w, p, data) => { const id = 'c' + genId(); db.comments[id] = { id, postId: p, ...clone(data) }; if (db.posts[p]) db.posts[p].cc = (db.posts[p].cc || 0) + 1; emit(); },
    deleteComment: async (w, p, c) => { delete db.comments[c]; if (db.posts[p]) db.posts[p].cc = Math.max(0, (db.posts[p].cc || 1) - 1); emit(); },
    getTeacher: async uid => clone(db.teachers[uid] || { games: [] }),
    saveTeacher: async (uid, data) => { db.teachers[uid] = { ...(db.teachers[uid] || {}), ...clone(data) }; emit(); },
  };
}

  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="x" aria-label="Fermer">✕</button></div><div class="modal-body"></div><div class="modal-actions"></div></div>`;
  const bodyEl = $('.modal-body', back);
  if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
  const act = $('.modal-actions', back);
  let closed = false;
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { if (closed) return; closed = true; back.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  document.addEventListener('keydown', onKey);
  actions.forEach(a => {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = async () => {
      if (a.onClick) { b.disabled = true; let r; try { r = await a.onClick(bodyEl, close); } catch (e) { if (e instanceof Fail) toast(e.message, 'err'); else { console.error(e); toast(errMsg(e), 'err'); } r = false; } b.disabled = false; if (r === false) return; }
      close();
    };
    act.appendChild(b);
  });
  if (!actions.length) act.remove();
  $('.x', back).onclick = close;
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.body.appendChild(back);
  return { el: bodyEl, close, root: back };
}

function loadImg(src) { return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; }); }
async function compressImage(file, maxDim = 1400, maxBytes = 600000) {
  const u = URL.createObjectURL(file); const img = await loadImg(u); URL.revokeObjectURL(u);
  let dim = maxDim, q = .82, data = '';
  for (let i = 0; i < 8; i++) {
    const s = Math.min(1, dim / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    data = c.toDataURL('image/jpeg', q);
    if (data.length * .75 < maxBytes) return data;
    q = Math.max(.45, q - .08); dim *= .85;
  }

}

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = 880; const s = AC.currentTime + t; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.22, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + .28); o.connect(g).connect(AC.destination); o.start(s); o.stop(s + .3); });
  } catch { }
}

    case 'highlight': if (!base.title && !base.body) fail('Écris le message à mettre en valeur.'); base.html = d.html || null; Object.assign(base, { hl: d.hl || 'red', icon: d.icon || '', pulse: !!d.pulse }); break;
    case 'image': if (!media.img) fail('Choisis une image.'); base.img = media.img; break;

    case 'link': { let u = (d.url || '').trim(); if (!u) fail('Colle une adresse.'); if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { new URL(u); } catch { fail('Adresse invalide.'); } base.url = u; base.preview = (d.previewFor === u && d.preview) ? d.preview : (await getPreview(u)) || null; break; }
    case 'youtube': { const id = ytId(d.url); if (!id) fail('Lien YouTube non reconnu.'); base.url = d.url.trim(); base.yt = id; break; }
    case 'clock': base.widget = { h12: !!d.widget?.h12, showDate: d.widget?.showDate !== false }; break;
    case 'timer': { const ms = Math.round(Math.max(.25, +d.widget?.min || 5) * 60000); base.widget = (editing && post.widget?.duration === ms) ? { ...post.widget } : { duration: ms, remaining: ms, running: false, endsAt: 0 }; delete base.widget.min; break; }
    case 'stopwatch': base.widget = editing ? { ...post.widget } : { running: false, startedAt: 0, acc: 0 }; break;
    case 'quizlet': { const q = quizletId(d.url); if (!q) fail('Lien Quizlet non reconnu (il doit contenir le numéro du set).'); base.url = d.url.trim(); base.widget = { qid: q, mode: d.widget?.mode || 'flashcards' }; break; }

        <label class="chk"><input type="checkbox" id="s-likes" ${w.allowLikes !== false ? 'checked' : ''}> Autoriser les « j'aime » ❤️</label><label class="chk"><input type="checkbox" id="s-cm" ${w.allowComments !== false ? 'checked' : ''}> Autoriser les commentaires 💬</label><label class="chk"><input type="checkbox" id="s-auth" ${w.showAuthors !== false ? 'checked' : ''}> Afficher le prénom des élèves sur leurs publications</label>`;
    } else if (tab === 'bg') {
      pane.innerHTML = `<div id="gal"></div><label class="f">Assombrir le fond (meilleure lisibilité) : <span id="dimv">${w.bgDim || 0}</span> %</label><input type="range" id="dim" min="0" max="70" step="5" value="${w.bgDim || 0}"><label class="f">Ou votre propre image</label><div class="row2"><div><label class="btn wide" for="bgf">📁 Choisir une image…</label><input type="file" id="bgf" accept="image/*" hidden></div><div class="muted small">${w.bg === 'custom' ? '✓ Image personnalisée active' : ''}</div></div>`;
      galleryInto($('#gal', pane), w.bg, v => { w.bg = v; preview(); });
      $('#dim', pane).oninput = e => { w.bgDim = +e.target.value; $('#dimv', pane).textContent = w.bgDim; preview(); };
      $('#bgf', pane).onchange = async e => { const f = e.target.files[0]; if (!f) return; w.bgImage = await compressImage(f, 1920, 450000); w.bg = 'custom'; preview(); draw(); };
    } else if (tab === 'sec') {
      pane.innerHTML = `<p class="muted small">Utilisées par le format « Colonnes ». Supprimer une colonne déplace ses cartes dans la première.</p>${w.sections.map((s, i) => `<div class="sec-row"><input value="${esc(s.title)}" maxlength="60"><button type="button" class="ct" data-m="up" data-i="${i}" title="Monter">↑</button><button type="button" class="ct" data-m="down" data-i="${i}" title="Descendre">↓</button><button type="button" class="ct" data-m="del" data-i="${i}" title="Supprimer">🗑</button></div>`).join('')}<button type="button" class="btn small" id="sec-add">＋ Ajouter une colonne</button>`;
      $$('[data-m]', pane).forEach(b => b.onclick = () => { read(); const i = +b.dataset.i, m = b.dataset.m, a = w.sections; if (m === 'up' && i > 0) [a[i - 1], a[i]] = [a[i], a[i - 1]]; if (m === 'down' && i < a.length - 1) [a[i + 1], a[i]] = [a[i], a[i + 1]]; if (m === 'del') { if (a.length <= 1) return toast('Il faut au moins une colonne.', 'err'); a.splice(i, 1); } draw(); });
      $('#sec-add', pane).onclick = () => { read(); w.sections.push({ id: 's' + genId(), title: 'New column' }); draw(); };
    } else {
      const visible = S.posts.filter(p => p.status === 'approved');
      pane.innerHTML = `<div class="act-list"><button class="btn" id="a-hide">🙈 Cacher toutes les publications</button><button class="btn" id="a-show">👁 Révéler toutes les publications</button><button class="btn" id="a-stud">🧹 Supprimer toutes les publications des élèves</button><button class="btn danger" id="a-del">🗑 Supprimer ce mur définitivement</button></div><p class="muted small">Ces actions s'appliquent immédiatement.</p>`;
      $('#a-hide', pane).onclick = () => guard(async () => { await S.store.batchUpdate(S.wallId, visible.filter(p => !p.hidden).map(p => p.id), { hidden: true }); toast('Toutes les publications sont cachées.', 'ok'); });
      $('#a-show', pane).onclick = () => guard(async () => { await S.store.batchUpdate(S.wallId, visible.filter(p => p.hidden).map(p => p.id), { hidden: false }); toast('Toutes les publications sont visibles.', 'ok'); });
      $('#a-stud', pane).onclick = async () => { const ids = S.posts.filter(p => p.authorUid !== S.wall.ownerUid).map(p => p.id); if (!ids.length) return toast('Aucune publication d’élève.'); if (await confirmBox(`Supprimer les ${ids.length} publications des élèves ?`, 'Supprimer')) guard(() => S.store.batchDelete(S.wallId, ids)); };
      $('#a-del', pane).onclick = async () => { if (!(await confirmBox(`Supprimer définitivement le mur « ${S.wall.title} » et toutes ses publications ?`, 'Supprimer le mur'))) return; await guard(async () => { await S.store.deleteWall(S.wallId); go(''); }); };
    }
  }
  root.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { read(); tab = b.dataset.tab; draw(); } });
  draw();
  modal({
    title: '⚙️ Réglages du mur', body: root, wide: true, onClose: () => updateChrome(true),
    actions: [{ label: 'Annuler' }, {
      label: 'Enregistrer', cls: 'primary', onClick: async () => {
        read(); if (!(w.title || '').trim()) fail('Il faut un titre.');
        w.sections = w.sections.map(s => ({ ...s, title: s.title.trim() || 'Column' }));
        const patch = { title: w.title.trim(), subtitle: (w.subtitle || '').trim(), format: w.format, allowComments: !!w.allowComments, allowLikes: !!w.allowLikes, showAuthors: !!w.showAuthors, bg: w.bg, bgImage: w.bg === 'custom' ? (w.bgImage || null) : null, bgDim: +w.bgDim || 0, sections: w.sections, updatedAt: Date.now() };
        await S.store.updateWall(S.wallId, patch); toast('Réglages enregistrés ✓', 'ok');
      }
    }]
  });
}

/* ---------------- démarrage ---------------- */
async function boot() {
  S.demo = new URLSearchParams(location.search).has('demo');
  document.documentElement.style.setProperty('--scale', S.scale);
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  const mq = matchMedia('(max-width: 700px)');
  const onMq = e => { S.mobile = e.matches; if (S.wall) renderPosts(); };
  mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);
  window.addEventListener('popstate', route);
  try { S.store = S.demo ? makeDemoStore() : await makeFirebaseStore(); }
  catch (e) { console.error(e); return viewFatal(); }
  let first = true;
  S.store.onAuth(u => { const changed = first || S.user?.uid !== u?.uid; S.user = u; first = false; if (changed) route(); });
}
boot();
</script>
</body>
</html>
